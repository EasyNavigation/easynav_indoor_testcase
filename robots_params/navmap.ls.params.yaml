controller_node:
  ros__parameters:
    use_sim_time: true
    # Robot velocity/acceleration limits: the controller plugins use them, and the velocity
    # smoother enforces them on every command published (see ControllerNode).
    robot_limits:
      max_linear_vel: 1.5
      min_linear_vel: -0.3
      max_angular_vel: 1.5
      max_linear_acc: 1.0
      max_linear_decel: 1.0
      max_angular_acc: 2.0
      max_angular_decel: 2.0
    controller_types: [mpc]
    mpc:
      rt_freq: 30.0 
      plugin: easynav_mpc_controller/MPCController

localizer_node:
  ros__parameters:
    use_sim_time: true
    localizer_types: [lidarslam]
    lidarslam:
      plugin: easynav_lidarslam_localizer/LidarSlamLocalizer
      input_cloud: /front_laser/points
      imu: /imu/data

maps_manager_node:
  ros__parameters:
    use_sim_time: true
    map_types: [navmap]
    navmap:
      freq: 10.0 
      plugin: easynav_navmap_maps_manager/NavMapMapsManager
      package: easynav_indoor_testcase
      navmap_path_file: maps/excavation_urjc.navmap

planner_node:
  ros__parameters:
    use_sim_time: true
    planner_types: [astart]
    astart:
      freq: 1.0
      plugin: easynav_navmap_planner/AStarPlanner

sensors_node:
  ros__parameters:
    use_sim_time: true
    forget_time: 0.5
    sensors: [laser, imu, gps]
    perception_default_frame: odom
    laser:
      topic: front_laser/points
      type: sensor_msgs/msg/PointCloud2
    camera:
      topic: front_camera/depth/color/points
      type: sensor_msgs/msg/PointCloud2
    imu:
      topic: imu/data
      type: sensor_msgs/msg/Imu
    gps:
      topic: gps/fix
      type: sensor_msgs/msg/NavSatFix

system_node:
  ros__parameters:
    use_sim_time: true
    position_tolerance: 0.1
    angle_tolerance: 0.05

scan_matcher:
  ros__parameters:
    use_sim_time: True
    registration_method: "NDT"
    ndt_resolution: 2.0
    ndt_num_threads: 2
    gicp_corr_dist_threshold: 5.0
    trans_for_mapupdate: 1.5
    vg_size_for_input: 0.5
    vg_size_for_map: 0.2
    use_min_max_filter: true
    scan_min_range: 1.0
    scan_max_range: 200.0
    scan_period: 0.2
    map_publish_period: 15.0
    num_targeted_cloud: 20
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0
    use_imu: false
    use_odom: false
    debug_flag: false

graph_based_slam:
    ros__parameters:
      use_sim_time: True
      registration_method: "NDT"
      ndt_resolution: 1.0
      ndt_num_threads: 2
      voxel_leaf_size: 0.2
      loop_detection_period: 3000
      threshold_loop_closure_score: 0.7
      distance_loop_closure: 100.0
      range_of_searching_loop_closure: 20.0
      search_submap_num: 2
      num_adjacent_pose_cnstraints: 5
      use_save_map_in_loop: true
      debug_flag: true

recovery_node:
  ros__parameters:
    use_sim_time: true
    # Level-0 safety reflex: stops the robot on imminent collision, checked every RT cycle
    # whoever produced cmd_vel (controller or mitigation). See docs/recoveries_easynav.md.
    safety_reflex_types: [collision]
    collision:
      plugin: easynav_collision_safety_reflex/CollisionSafetyReflex
      debug_markers: true
      downsample_leaf_size: 0.05
      robot_radius: 0.30
      brake_acc: 1.0
      safety_margin: 0.05
    # Level-1 recovery (see docs/recoveries_easynav.md). Evaluators diagnose; mitigations are
    # tried in priority order (lower first) for each ERROR diagnostic they can handle:
    #   specific movement fixes (10) -> terminate EasyNav on a miswired graph (100)
    #   -> wait for a human (1000) -> cancel the mission (2000).
    evaluator_types: [no_path, obstacle_close, controller_stuck, ros_graph]
    no_path:
      plugin: easynav_no_path_evaluator/NoPathEvaluator
    obstacle_close:
      plugin: easynav_obstacle_too_close_evaluator/ObstacleTooCloseEvaluator
      safe_distance: 0.4          # ERROR if stopped this close to an obstacle...
      debounce_duration: 0.5      # ...for this long (s)
    controller_stuck:
      plugin: easynav_controller_stuck_evaluator/ControllerStuckEvaluator
      linear_velocity_threshold: 0.02
      progress_distance_threshold: 0.05
      stuck_time_threshold: 3.0
    ros_graph:
      plugin: easynav_ros_graph_evaluator/RosGraphEvaluator
      freq: 1.0
      startup_grace: 15.0         # s after activation for the simulator/driver to come up
      error_debounce: 2.0
      # Optional inputs that may legitimately have no publisher.
      ignored_topics: ["goal_pose", "initialpose", "incoming_map", "incoming_occ_map", "incoming_pc2_map"]
      # Tools that only watch cmd_vel: they do not count as something driving the robot.
      ignored_consumers: ["easynav_tui_*", "_ros2cli*"]
    mitigation_types: [retreat, advance, shutdown, human_assistance, cancel_mission]
    retreat:
      plugin: easynav_safe_retreat_recovery/SafeRetreatRecovery
      priority: 10
      safe_distance: 0.5          # > obstacle_close.safe_distance, so it does not re-trigger
      retreat_speed: 0.1
    advance:
      plugin: easynav_advance_recovery/AdvanceRecovery
      priority: 10
      advance_distance: 0.3
      advance_speed: 0.1
      escalate_after: 15.0        # s of repeated advances before giving up to the next rung
      episode_gap: 10.0
    shutdown:
      plugin: easynav_shutdown_recovery/ShutdownRecovery
      priority: 100
      handled_hardware_ids: ["ros_graph"]
    human_assistance:
      plugin: easynav_human_assistance_recovery/HumanAssistanceRecovery
      priority: 1000
      timeout: 30.0
      ignored_hardware_ids: ["ros_graph"]
    cancel_mission:
      plugin: easynav_cancel_mission_recovery/CancelMissionRecovery
      priority: 2000
