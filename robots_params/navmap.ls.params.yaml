controller_node:
  ros__parameters:
    use_sim_time: true
    # Robot velocity/acceleration limits: the controller plugins use them, and the velocity
    # smoother enforces them on every command published (see ControllerNode).
    robot_limits:
      max_linear_vel: 1.5
      min_linear_vel: -0.3
      max_angular_vel: 1.5
      max_linear_acc: 1.0
      max_linear_decel: 1.0
      max_angular_acc: 2.0
      max_angular_decel: 2.0
    controller_types: [mpc]
    mpc:
      rt_freq: 30.0 
      plugin: easynav_mpc_controller/MPCController

localizer_node:
  ros__parameters:
    use_sim_time: true
    localizer_types: [lidarslam]
    lidarslam:
      plugin: easynav_lidarslam_localizer/LidarSlamLocalizer
      input_cloud: /front_laser/points
      imu: /imu/data

maps_manager_node:
  ros__parameters:
    use_sim_time: true
    map_types: [navmap]
    navmap:
      freq: 10.0 
      plugin: easynav_navmap_maps_manager/NavMapMapsManager
      package: easynav_indoor_testcase
      navmap_path_file: maps/excavation_urjc.navmap

planner_node:
  ros__parameters:
    use_sim_time: true
    planner_types: [astart]
    astart:
      freq: 1.0
      plugin: easynav_navmap_planner/AStarPlanner

sensors_node:
  ros__parameters:
    use_sim_time: true
    forget_time: 0.5
    sensors: [laser, imu, gps]
    perception_default_frame: odom
    laser:
      topic: front_laser/points
      type: sensor_msgs/msg/PointCloud2
    camera:
      topic: front_camera/depth/color/points
      type: sensor_msgs/msg/PointCloud2
    imu:
      topic: imu/data
      type: sensor_msgs/msg/Imu
    gps:
      topic: gps/fix
      type: sensor_msgs/msg/NavSatFix

system_node:
  ros__parameters:
    # The robot's shape, shared by every component (collision checking, inflation, recovery...).
    robot_geometry:
      radius: 0.3
      height: 0.5
    use_sim_time: true
    position_tolerance: 0.1
    angle_tolerance: 0.05

scan_matcher:
  ros__parameters:
    use_sim_time: True
    registration_method: "NDT"
    ndt_resolution: 2.0
    ndt_num_threads: 2
    gicp_corr_dist_threshold: 5.0
    trans_for_mapupdate: 1.5
    vg_size_for_input: 0.5
    vg_size_for_map: 0.2
    use_min_max_filter: true
    scan_min_range: 1.0
    scan_max_range: 200.0
    scan_period: 0.2
    map_publish_period: 15.0
    num_targeted_cloud: 20
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0
    use_imu: false
    use_odom: false
    debug_flag: false

graph_based_slam:
    ros__parameters:
      use_sim_time: True
      registration_method: "NDT"
      ndt_resolution: 1.0
      ndt_num_threads: 2
      voxel_leaf_size: 0.2
      loop_detection_period: 3000
      threshold_loop_closure_score: 0.7
      distance_loop_closure: 100.0
      range_of_searching_loop_closure: 20.0
      search_submap_num: 2
      num_adjacent_pose_cnstraints: 5
      use_save_map_in_loop: true
      debug_flag: true

recovery_node:
  ros__parameters:
    use_sim_time: true
    # Recovery system: a RecoveryManagerBase plugin, with its own parameters below it.
    # SimpleRecoveryManager: brakes before an obstacle ahead, rotates to relocalize, backs up when
    # stuck, and aborts the mission or terminates EasyNav when that is not enough.
    recovery_manager:
      plugin: easynav_simple_recovery/SimpleRecoveryManager
      stop_distance: 0.3          # brake if an obstacle is this close ahead (beyond the robot radius)
      min_obstacle_z: 0.05
      sensors_timeout: 5.0        # s without sensor data: terminate EasyNav
      max_position_variance: 1.0  # m^2 in x or y: localization lost
      relocalize_timeout: 20.0
      rotate_speed: 0.3
      stuck_time: 10.0
      stuck_distance: 0.05
      backup_speed: 0.1
      backup_time: 2.0
      max_backup_attempts: 3
      slow_down_max_linear_vel: 0.1  # still stuck after the attempts: slow down, then abort
